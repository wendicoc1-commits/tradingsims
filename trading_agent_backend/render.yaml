services:
  - type: web
    name: fincept-trading-agent
    env: python
    rootDir: trading_agent_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEYS
        sync: false
